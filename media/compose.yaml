# =============================================================================
#  Медиа-стек для Synology DS725+ (192.168.3.53)
#  Проект Container Manager: /volume1/docker/hh-homelab/media
# =============================================================================
#  Шесть контейнеров в общей bridge-сети `media`. Все веб-интерфейсы
#  опубликованы на хосте, поэтому Home Assistant, работающий в host-сети,
#  достаёт их по 127.0.0.1 — см. homeassistant/config/packages/monitoring.yaml.
#
#  Порты: 9080 и 6881 (qBittorrent), 9696 (Prowlarr), 7878 (Radarr),
#  8191 (FlareSolverr), 8096 и 7359 (Jellyfin), 5055 (Seerr).
#
#  ВСЕ НАСТРОЙКИ — В .env РЯДОМ С ЭТИМ ФАЙЛОМ, образец в .env.example.
#  Туда вынесены PUID/PGID/UMASK, часовой пояс, корень библиотеки, адрес
#  привязки, имя сети и все порты: репозиторий публичный, и чужие значения
#  не должны подставляться молча.
#
#  Значений по умолчанию нет намеренно. Форма ${ПЕРЕМЕННАЯ:?...} роняет
#  `docker compose up` с внятным сообщением, если .env забыли. Голый
#  ${ПЕРЕМЕННАЯ} так не умеет: Compose подставил бы пустую строку, вернул
#  код 0, и стек поднялся бы с PUID= (root), UTC вместо своего пояса
#  и БЕЗ ОПУБЛИКОВАННЫХ ПОРТОВ — снаружи это выглядит как сломанные
#  приложения, а не как забытый файл. Метка ставится один раз на переменную
#  В КАЖДОМ сервисе: так ни одна не проскочит предупреждением «defaulting
#  to a blank string», в каком бы порядке Compose ни разбирал сервисы,
#  и при этом строки портов остаются читаемыми.
#
#  ПЕРЕМЕННАЯ ПОРТА МЕНЯЕТ ТОЛЬКО ПОРТ ХОСТА. Со стороны контейнера номера
#  записаны литералами — 9080, 9696, 7878, 8191, 8096, 5055, — потому что
#  они часть внутреннего устройства стека: Prowlarr, Radarr и Jellyfin
#  слушают их жёстко, а Prowlarr ходит к FlareSolverr по имени
#  `flaresolverr:8191`, Radarr к qBittorrent — `qbittorrent:9080`.
#  Сдвинь мы обе стороны разом — публикация указывала бы в пустоту,
#  а настройки, сделанные по чек-листу, перестали бы совпадать.
#  Конфликт же всегда на стороне ХОСТА, и лечится он только там.
#
#  Исключение — QBITTORRENT_TORRENT_PORT: он меняется с обеих сторон.
#  qBittorrent объявляет пирам тот номер, на котором слушает, и на роутере
#  пробрасывается он же. Разъедься эти три числа — входящих соединений
#  не будет вовсе.
#
#  JELLYFIN_DISCOVERY_PORT тоже особый: 7359 — фиксированный порт протокола
#  автопоиска, клиенты стучатся только в него. Переменная нужна, если порт
#  занят, но со сменой номера автопоиск просто перестаёт работать —
#  сервер придётся прописывать в приложениях руками.
#
#  PUID/PGID — пользователь DSM, владеющий каталогом библиотеки.
#  Проверить свои: `id ваш_логин` по SSH на NAS.
#
#  Пути к состоянию сервисов — ОТНОСИТЕЛЬНЫЕ (./config/<сервис>), как и
#  ./config у Home Assistant. Compose разрешает их от каталога самого
#  compose.yaml, поэтому весь стек переносится вместе с репозиторием:
#  склонировали в другое место — и он поднимается там же, без правки путей.
#  Каталоги создаются рядом с этим файлом:
#      config/{qbittorrent,prowlarr,radarr,jellyfin,seerr}  состояние и базы
#      cache/jellyfin                                       кэш метаданных
#      watch/                                               .torrent на подхват
#  Всё это в .gitignore: там базы SQLite и логи, версионировать их нечего.
#
#  А библиотека остаётся СНАРУЖИ репозитория, и причина не в хардлинках.
#  Рабочее дерево git — это то, что чистят: `git clean -xdf` не щадит и
#  игнорируемое, а «снести клон и склонировать заново» — обычный способ
#  починить запутавшийся репозиторий. Медиатека такого пережить не должна.
#  Плюс разные жизненные циклы: конфигурацию заменяют целиком, библиотека
#  копится годами и обязана переживать любые операции над репозиторием.
#
#  Путь задаётся переменной MEDIA_ROOT из media/.env — см. .env.example.
#  На другом NAS правится одна строка в .env, сам compose.yaml
#  трогать не нужно.
#
#  Для хардлинков важна не абсолютность пути, а то, что том монтируется
#  ЦЕЛИКОМ и одинаково в qBittorrent и Radarr: внутри обоих контейнеров
#  /data/torrents и /data/media лежат на одной файловой системе. Две
#  отдельные папки вместо одного тома сломали бы импорт хардлинком —
#  и это не зависит от того, записан путь абсолютно или через переменную.
#
#  По схожей логике в homeassistant/compose.yaml относителен лишь ./config,
#  а /etc/localtime и docker.sock записаны абсолютно: они принадлежат хосту,
#  а не проекту.
#
#  Логи ограничены у каждого сервиса: json-file, 10 МБ на файл, 3 файла.
#  По умолчанию Docker не ротирует журнал вообще — файл растёт, пока не
#  кончится место на томе, причём отнимает его у библиотеки и баз на том же
#  /volume1. Заметнее всего у Jellyfin и FlareSolverr: первый пишет на каждый
#  запрос плеера, второй — ход каждого обхода Cloudflare.
#  Потолок на стек — 6 сервисов x 30 МБ = 180 МБ, дальше самые старые записи
#  вытесняются. Журналы лежат в /volume1/@docker/containers.
#  Настройка применяется при СОЗДАНИИ контейнера: после правки нужен
#  `docker compose up -d`, перезапуск её не подхватит. Подробности —
#  docs/logs.html.
# =============================================================================

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls474
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:?см. .env.example}
      - PGID=${PGID:?см. .env.example}
      - UMASK=${UMASK:?см. .env.example}
      - TZ=${TZ:?см. .env.example}
      - WEBUI_PORT=9080
      - TORRENTING_PORT=${QBITTORRENT_TORRENT_PORT:?см. .env.example}
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.35.0
    volumes:
      - ./config/qbittorrent:/config
      - ./watch:/watch
      - ${MEDIA_ROOT:?см. .env.example}:/data
    ports:
      - "${BIND_ADDR:?см. .env.example}:${QBITTORRENT_WEBUI_PORT:?см. .env.example}:9080"
      - "${BIND_ADDR}:${QBITTORRENT_TORRENT_PORT}:${QBITTORRENT_TORRENT_PORT}"
      - "${BIND_ADDR}:${QBITTORRENT_TORRENT_PORT}:${QBITTORRENT_TORRENT_PORT}/udp"
    networks:
      - media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls158
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:?см. .env.example}
      - PGID=${PGID:?см. .env.example}
      - UMASK=${UMASK:?см. .env.example}
      - TZ=${TZ:?см. .env.example}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "${BIND_ADDR:?см. .env.example}:${PROWLARR_PORT:?см. .env.example}:9696"
    networks:
      - media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls314
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:?см. .env.example}
      - PGID=${PGID:?см. .env.example}
      - UMASK=${UMASK:?см. .env.example}
      - TZ=${TZ:?см. .env.example}
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_ROOT:?см. .env.example}:/data
    ports:
      - "${BIND_ADDR:?см. .env.example}:${RADARR_PORT:?см. .env.example}:7878"
    networks:
      - media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:?см. .env.example}
    ports:
      - "${BIND_ADDR:?см. .env.example}:${FLARESOLVERR_PORT:?см. .env.example}:8191"
    networks:
      - media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2604-ls47
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:?см. .env.example}
      - PGID=${PGID:?см. .env.example}
      - UMASK=${UMASK:?см. .env.example}
      - TZ=${TZ:?см. .env.example}
      - JELLYFIN_PublishedServerUrl=http://${NAS_HOST:?см. .env.example}:${JELLYFIN_PORT:?см. .env.example}
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - ${MEDIA_ROOT:?см. .env.example}/media:/data/media:ro
    ports:
      - "${BIND_ADDR:?см. .env.example}:${JELLYFIN_PORT:?см. .env.example}:8096"
      - "${BIND_ADDR}:${JELLYFIN_DISCOVERY_PORT:?см. .env.example}:7359/udp"
    networks:
      - media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      - TZ=${TZ:?см. .env.example}
      - LOG_LEVEL=info
      - PORT=5055
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "${BIND_ADDR:?см. .env.example}:${SEERR_PORT:?см. .env.example}:5055"
    depends_on:
      - radarr
      - jellyfin
    networks:
      - media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  media:
    name: ${MEDIA_NETWORK:?см. .env.example}
    driver: bridge
