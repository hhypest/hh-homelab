name: Выпуск

# Ставит тег и создаёт релиз. Запускается только вручную: выпуск —
# осознанное действие, а не следствие очередного push в main.
#
# Зачем workflow, если то же делается двумя командами в терминале.
# Во-первых, здесь это делается одинаково каждый раз: тег с тем же
# сообщением, тело релиза из тех же источников. Во-вторых, внутри Actions
# работает GITHUB_TOKEN с правом contents: write, поэтому подготовить
# выпуск может тот, у кого нет прав пушить теги напрямую.
#
# Таблица версий образов собирается из самих compose-файлов, а не пишется
# руками: описание релиза физически не может разойтись с тем, что
# закреплено в конфигурации.
#
# Разделение на две задачи намеренное. Проверки ставят зависимости
# из сети и запускают их код — делать это в задаче, у которой есть право
# ставить теги, незачем. Право на запись выдано только второй задаче,
# и она не устанавливает ничего.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без префикса v, например 1.0.0"
        required: true
        type: string
      dry_run:
        description: "Только проверить, ничего не создавать"
        required: false
        default: false
        type: boolean

# По умолчанию — только чтение. Запись включена ровно в одной задаче.
permissions:
  contents: read

# Два выпуска разом — верный способ получить состояние, которого никто
# не заказывал. Второй запуск ждёт, а не отменяет первый на полпути.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:

  checks:
    name: Проверки выпуска
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Раньше этой проверки не было, и тег можно было поставить с любой
      # ветки: workflow_dispatch запускается на выбранном ref.
      - name: Выпускать только из main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Выпуск идёт только из main, а выбрано: $GITHUB_REF"
            exit 1
          fi

      # fetch-depth: 0 — нужны все теги, иначе проверка «такой версии ещё
      # нет» ничего не увидит и молча разрешит второй тег.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # Значение приходит через окружение, а не подстановкой в текст
      # скрипта. Подстановка выполнялась ДО проверки формата, поэтому
      # одинарная кавычка во вводе обрывала строку и остаток попадал
      # в оболочку — в задаче с правом записи в репозиторий.
      - name: Проверить формат версии
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION_INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Версия «$VERSION_INPUT» не похожа на X.Y.Z"
            exit 1
          fi
          {
            echo "version=$VERSION_INPUT"
            echo "tag=v$VERSION_INPUT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$VERSION_INPUT"
            echo "TAG=v$VERSION_INPUT"
          } >> "$GITHUB_ENV"

      # Тег на этом же коммите — не ошибка, а незаконченный прошлый запуск:
      # тег ушёл, а релиз создать не успели. Такой случай надо доводить
      # до конца, а не запрещать. Тег на другом коммите — настоящий конфликт.
      - name: Убедиться, что выпуск возможен
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            on_tag="$(git rev-list -n 1 "refs/tags/$TAG")"
            head="$(git rev-parse HEAD)"
            if [ "$on_tag" != "$head" ]; then
              echo "::error::Тег $TAG уже указывает на $on_tag, а выпуск готовится из $head"
              exit 1
            fi
            echo "::notice::Тег $TAG уже есть на этом коммите — повторный запуск завершит начатое"
          fi

      # Тег без описания — половина выпуска. Если история версий про эту
      # версию молчит, значит changelog забыли, и релиз выйдет пустым.
      - name: Сверить с историей версий
        run: |
          page=docs/changelog.html
          if ! grep -q "<div class=\"kicker\">$VERSION</div>" "$page"; then
            echo "::error::В $page нет раздела с версией $VERSION"
            exit 1
          fi
          if ! grep -q "текущий выпуск <b>$VERSION</b>" "$page"; then
            echo "::error::В шапке $page текущим выпуском значится не $VERSION"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - run: pip install -r requirements-dev.txt -c constraints.txt

      # Те же проверки, что и в «Проверки». Дублирование намеренное:
      # выпуск должен отвечать за себя сам, а не полагаться на то, что
      # когда-то на этом коммите что-то было зелёным.
      - name: Прогнать проверки
        run: |
          yamllint homeassistant media pachca .github
          python3 scripts/validate_config.py
          python3 scripts/validate_entities.py
          python3 scripts/render_pachca.py --check
          python3 scripts/validate_docs.py
          python3 scripts/check_files.py
          python3 scripts/check_ports.py media/compose.yaml homeassistant/compose.yaml
          ruff check .
          pytest -q

      - name: Итог проверки
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### Проверка прошла: $TAG выпустить можно"
              echo "Ничего не создано — снимите галку «Только проверить»."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Тег и релиз
    needs: checks
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Единственное место с правом записи. Здесь ничего не устанавливается
    # из сети: описание собирается тем, что есть в образе runner.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      TAG: ${{ needs.checks.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # Версии берутся из compose-файлов, поэтому описание релиза
      # не может разойтись с тем, что реально закреплено.
      - name: Составить описание релиза
        run: |
          {
            echo '| Образ | Версия |'
            echo '|---|---|'
            grep -hoP '(image:|DOCKER_MODS=)\s*\K\S+' \
              media/compose.yaml homeassistant/compose.yaml \
              | sort -u \
              | while IFS= read -r ref; do
                  printf '| `%s` | `%s` |\n' "${ref%:*}" "${ref##*:}"
                done
          } > images.md
          {
            printf 'Домашний сервер на Synology DS725+: медиа-стек и Home Assistant.\n\n'
            printf 'Выпуск фиксирует состав конфигурации и версии образов: клон этого\n'
            printf 'тега поднимает тот же набор сервисов тех же версий. Прикладное\n'
            printf 'состояние — базы сервисов, реестр Home Assistant, секреты — в тег\n'
            printf 'не входит и восстанавливается из резервной копии отдельно.\n\n'
            printf '### Состав\n\n'
            cat images.md
            printf '\n### Подробнее\n\n'
            printf 'Что вошло, известные ограничения и порядок обновления — '
            printf '[история версий](https://hhypest.github.io/hh-homelab/changelog.html).\n'
          } > notes.md
          cat notes.md

      - name: Создать тег, если его ещё нет
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Тег $TAG уже на месте — остаётся создать релиз"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "hh-homelab $VERSION" -m "$(cat notes.md)"
          git push origin "$TAG"

      - name: Создать релиз, если его ещё нет
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — ничего не меняю"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$VERSION" \
            --notes-file notes.md \
            --verify-tag

      - name: Итог
        run: |
          {
            echo "### Выпуск $TAG готов"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
