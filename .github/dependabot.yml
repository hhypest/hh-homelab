# Обновления зависимостей.
# Действия GitHub закреплены по SHA коммита, а не по тегу: тег изменяемый,
# и @v7 в задаче с правом ставить теги — это чужой коммит, выполняемый
# с этим правом, если тег переставят. Рядом с SHA стоит комментарий с версией,
# иначе прочитать файл нельзя; Dependabot обновляет и SHA, и комментарий.
#
# Проверки на Python закреплены дважды: requirements-dev.txt задаёт нижние
# границы, constraints.txt — точные версии всего установленного, включая
# транзитивное. Без второго файла один и тот же коммит мог быть зелёным
# вчера и красным сегодня.
#
# Обновления собраны в группы намеренно. Порознь Dependabot заводит по PR
# на каждое действие, ветки эти созданы от одного и того же старого main,
# и при слиянии второго PR правки первого молча откатываются: так в main
# и оказалось шесть checkout@v4 рядом с одним checkout@v7.
# Один PR на всю экосистему такой ситуации не допускает.
#
# Образов здесь нет намеренно
# ---------------------------
# Экосистема docker-compose стояла тут две недели и не завела ни одного
# пул-реквеста, пока шесть образов уходили вперёд. Всё проверяемое
# оказалось верным: имя экосистемы, регулярное выражение имён файлов
# из dependabot-core, поддержка ключей directory и directories,
# доступность реестра, наличие свежих тегов, собственный валидатор
# конфига. Разбиение блока на два ничего не изменило. Причина осталась
# неизвестной, и выяснять её дальше — не та работа, ради которой стоит
# держать неработающую настройку.
#
# Версии образов теперь сверяются вручную:
#
#     python3 scripts/check_image_updates.py
#
# Скрипт читает оба compose-файла вместе с DOCKER_MODS — последнее
# Dependabot не умел в принципе, — ходит в реестр и говорит, что отстало.
# Разбор истории: docs/changelog.html, раздел «Dependabot: образы молчали
# две недели».
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: [зависимости]
    groups:
      действия:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "тесты"
    labels: [зависимости]
    groups:
      проверки:
        patterns: ["*"]
