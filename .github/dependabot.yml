# Обновления зависимостей.
# Действия GitHub закрепляются мажорными тегами (@v7) и всё равно устаревают:
# раз в месяц Dependabot предложит перейти на следующий мажор.
#
# Обновления собраны в группы намеренно. Порознь Dependabot заводит по PR
# на каждое действие, ветки эти созданы от одного и того же старого main,
# и при слиянии второго PR правки первого молча откатываются: так в main
# и оказалось шесть checkout@v4 рядом с одним checkout@v7.
# Один PR на всю экосистему такой ситуации не допускает.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: [зависимости]
    groups:
      действия:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "тесты"
    labels: [зависимости]
    groups:
      проверки:
        patterns: ["*"]
