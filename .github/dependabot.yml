# Обновления зависимостей.
# Действия GitHub закреплены по SHA коммита, а не по тегу: тег изменяемый,
# и @v7 в задаче с правом ставить теги — это чужой коммит, выполняемый
# с этим правом, если тег переставят. Рядом с SHA стоит комментарий с версией,
# иначе прочитать файл нельзя; Dependabot обновляет и SHA, и комментарий.
#
# Проверки на Python закреплены дважды: requirements-dev.txt задаёт нижние
# границы, constraints.txt — точные версии всего установленного, включая
# транзитивное. Без второго файла один и тот же коммит мог быть зелёным
# вчера и красным сегодня.
#
# Обновления собраны в группы намеренно. Порознь Dependabot заводит по PR
# на каждое действие, ветки эти созданы от одного и того же старого main,
# и при слиянии второго PR правки первого молча откатываются: так в main
# и оказалось шесть checkout@v4 рядом с одним checkout@v7.
# Один PR на всю экосистему такой ситуации не допускает.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: [зависимости]
    groups:
      действия:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "тесты"
    labels: [зависимости]
    groups:
      проверки:
        patterns: ["*"]

  # Образы контейнеров. Оба compose-файла закреплены на конкретных версиях —
  # плавающие :latest и :stable приносили бы мажорное обновление молча, в тот
  # момент, когда Docker решит перекачать образ. Теперь оно приходит
  # пул-реквестом: проверки прогоняются, changelog читается, мержится когда
  # удобно. Обновляться придётся руками — это и есть цель.
  #
  # Раз в неделю, а не в месяц: у Home Assistant месячный цикл релизов
  # с исправлениями между ними, а у linuxserver-образов сборки выходят чаще.
  #
  # Почему два блока, а не один с directories
  # -----------------------------------------
  # Сначала здесь стоял один блок со списком каталогов. За две недели он не
  # завёл ни одного PR, хотя обновления были: Jellyfin, Radarr, Prowlarr,
  # FlareSolverr и Home Assistant успели уйти вперёд. Причину снаружи
  # установить не удалось — всё проверяемое оказалось верным: имя экосистемы
  # (docker-compose), совпадение compose.yaml с FILENAME_REGEX фетчера,
  # поддержка directories, доступность реестров. Отсутствие compose-файлов
  # в графе зависимостей — не симптом: Docker в граф не входит вовсе.
  #
  # Осталась одна конструкция, которой нет в двух работающих блоках выше, —
  # directories во множественном числе. Разбито на два блока с directory,
  # чтобы исключить её. Это проверка гипотезы, а не известное лекарство:
  # если PR не появятся и теперь, дело не в ней.
  #
  # Два PR вместо одного здесь безопасны. Прежняя беда — когда ветки от
  # одного старого main откатывают правки друг друга — случается, только
  # если PR трогают один и тот же файл. Эти два не пересекаются: у каждого
  # свой compose.yaml.
  - package-ecosystem: docker-compose
    directory: /media
    schedule:
      interval: weekly
    commit-message:
      prefix: "образы"
    labels: [зависимости]
    groups:
      медиа-стек:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /homeassistant
    schedule:
      interval: weekly
    commit-message:
      prefix: "образы"
    labels: [зависимости]
    groups:
      home-assistant:
        patterns: ["*"]
