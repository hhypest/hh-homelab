# Обновления зависимостей.
# Действия GitHub закрепляются мажорными тегами (@v4) и всё равно устаревают:
# раз в месяц Dependabot предложит перейти на следующий мажор.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: [зависимости]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "тесты"
    labels: [зависимости]
