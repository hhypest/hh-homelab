# =============================================================================
#  packages/monitoring.yaml — метрики DS725+, контейнеров и сервисов
# =============================================================================
#  Источники данных:
#
#   1. Synology DSM       — CPU, RAM, температура, тома, диски, SMART, сеть,
#                           аптайм, статус безопасности. Настраивается в UI.
#   2. Monitor Docker     — метрики по каждому контейнеру, см. packages/docker.yaml
#   3. Command line       — HTTP-пинг каждого сервиса стека: живой ли он
#                           на самом деле, а не «контейнер запущен».
#   4. Jellyfin / Radarr / qBittorrent — прикладные интеграции (шаг 4.4).
#
#  Почему мало одного Monitor Docker: он видит контейнер запущенным даже
#  тогда, когда приложение внутри намертво висит. HTTP-проверка ловит ровно
#  это — и потому здесь два слоя, а не один.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. HTTP-проверки сервисов
# -----------------------------------------------------------------------------
# HA работает в host-сети NAS, поэтому все сервисы доступны на 127.0.0.1.
# Префикс "svc " в имени даёт предсказуемые entity_id: binary_sensor.svc_*
# — по нему автоматизации и сводки находят все проверки разом.
#
# Списки кодов из команд убраны. Раньше второй аргумент ЗАМЕНЯЛ набор
# по умолчанию, и перечислять 200 приходилось, чтобы проверка не считала
# живой сервис мёртвым. Теперь аргумент добавляет коды к набору
# 200/201/204/301/302/401/403, и для всех шести сервисов он не нужен:
# сенсор отвечает на вопрос «сервис жив?», а сервис за формой логина жив.
command_line:

  - binary_sensor:
      name: "svc qBittorrent"
      unique_id: svc_qbittorrent_http
      command: "python3 /config/bin/http_check.py http://127.0.0.1:9080/"
      device_class: connectivity
      scan_interval: 60
      command_timeout: 15

  - binary_sensor:
      name: "svc Prowlarr"
      unique_id: svc_prowlarr_http
      command: "python3 /config/bin/http_check.py http://127.0.0.1:9696/ping"
      device_class: connectivity
      scan_interval: 60
      command_timeout: 15

  - binary_sensor:
      name: "svc Radarr"
      unique_id: svc_radarr_http
      command: "python3 /config/bin/http_check.py http://127.0.0.1:7878/ping"
      device_class: connectivity
      scan_interval: 60
      command_timeout: 15

  - binary_sensor:
      name: "svc FlareSolverr"
      unique_id: svc_flaresolverr_http
      command: "python3 /config/bin/http_check.py http://127.0.0.1:8191/"
      device_class: connectivity
      scan_interval: 120
      command_timeout: 15

  - binary_sensor:
      name: "svc Jellyfin"
      unique_id: svc_jellyfin_http
      command: "python3 /config/bin/http_check.py http://127.0.0.1:8096/health"
      device_class: connectivity
      scan_interval: 60
      command_timeout: 15

  - binary_sensor:
      name: "svc Seerr"
      unique_id: svc_seerr_http
      command: "python3 /config/bin/http_check.py http://127.0.0.1:5055/api/v1/status"
      device_class: connectivity
      scan_interval: 60
      command_timeout: 15

# -----------------------------------------------------------------------------
# 2. Производные сенсоры
# -----------------------------------------------------------------------------
template:

  - sensor:
      - name: "Сервисы недоступны"
        unique_id: stack_services_down_count
        icon: mdi:alert-circle-outline
        state: >-
          {{ states.binary_sensor
             | selectattr('entity_id', 'search', '^binary_sensor\\.svc_')
             | selectattr('state', 'eq', 'off') | list | count }}
        attributes:
          # Список имён — им пользуется сообщение в Пачку
          services: >-
            {{ states.binary_sensor
               | selectattr('entity_id', 'search', '^binary_sensor\\.svc_')
               | selectattr('state', 'eq', 'off')
               | map(attribute='name') | map('replace', 'svc ', '') | list }}
          total: >-
            {{ states.binary_sensor
               | selectattr('entity_id', 'search', '^binary_sensor\\.svc_')
               | list | count }}

  - binary_sensor:
      # Имя латиницей намеренно: entity_id получается предсказуемым —
      # binary_sensor.stack_problem. На него ссылаются history_stats ниже
      # и сводка в Пачку. Человеческое название можно задать в интерфейсе.
      - name: "Stack problem"
        unique_id: stack_healthy
        device_class: problem
        # device_class: problem → "on" означает ПРОБЛЕМУ
        state: >-
          {{ states.binary_sensor
             | selectattr('entity_id', 'search', '^binary_sensor\\.svc_')
             | selectattr('state', 'eq', 'off') | list | count > 0 }}
        delay_on: "00:03:00"
        delay_off: "00:01:00"

      # ---------------------------------------------------------------------
      #  Пороги: почему сущностями, а не триггерами numeric_state
      # ---------------------------------------------------------------------
      #  numeric_state срабатывает на ПЕРЕХОДЕ «вне диапазона → внутрь».
      #  При настройке Home Assistant взводит только те сущности, которые
      #  на этот момент находятся вне диапазона:
      #
      #      homeassistant/components/homeassistant/triggers/numeric_state.py
      #      # Each entity that starts outside the range is already armed.
      #      for entity_id in entity_ids:
      #          if not check_numeric_state(entity_id, None, entity_id):
      #              armed_entities.add(entity_id)
      #
      #  Сущность, УЖЕ находящаяся за порогом, должна сначала выйти
      #  из диапазона и войти обратно. Для заканчивающегося места это
      #  означает «никогда»: том занят на 90 %, вы перезагрузили NAS —
      #  и предупреждение не придёт, сколько бы ни было занято. Перегрев
      #  усугубляет: Home Assistant чаще всего перезапускают под нагрузкой.
      #
      #  Шаблонный сенсор ведёт себя иначе: после перезапуска он стартует
      #  из unknown и переходит в on — это настоящий переход состояния,
      #  и автоматика на него срабатывает. Сообщение придёт после каждого
      #  перезапуска, пока порог держится, и это лучше, чем не прийти вовсе.
      #
      #  float(-1) по умолчанию — чтобы недоступный сенсор не превращался
      #  в ноль и не выглядел как «всё хорошо»: -1 ниже любого порога.
      - name: "NAS hot"
        unique_id: nas_hot
        device_class: heat
        state: "{{ states('sensor.ds725_temperature') | float(-1) > 60 }}"
        delay_on: "00:10:00"
        delay_off: "00:05:00"

      - name: "NAS cpu busy"
        unique_id: nas_cpu_busy
        device_class: problem
        state: "{{ states('sensor.ds725_cpu_utilization_total') | float(-1) > 90 }}"
        delay_on: "00:20:00"
        delay_off: "00:05:00"

      - name: "NAS volume filling"
        unique_id: nas_volume_filling
        device_class: problem
        state: "{{ states('sensor.ds725_volume_1_volume_used') | float(-1) > 85 }}"

      - name: "NAS volume critical"
        unique_id: nas_volume_critical
        device_class: problem
        state: "{{ states('sensor.ds725_volume_1_volume_used') | float(-1) > 93 }}"

# -----------------------------------------------------------------------------
# 2а. Накопительная статистика за сутки — для утренней сводки
# -----------------------------------------------------------------------------
# history_stats считает, сколько времени сущность провела в заданном состоянии.
# Это единственный способ ответить на вопрос «а как всё работало ночью, пока
# я спал» — мгновенные значения на него не отвечают.
sensor:
  - platform: history_stats
    name: "Stack downtime 24h"
    unique_id: stack_downtime_24h
    entity_id: binary_sensor.stack_problem
    state: "on"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Docker downtime 24h"
    unique_id: docker_downtime_24h
    entity_id: binary_sensor.docker_problem
    state: "on"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

# -----------------------------------------------------------------------------
# 3. Автоматизации-сторожа
# -----------------------------------------------------------------------------
automation:

  # --- 3.1 Любой сервис перестал отвечать ------------------------------------
  - id: mon_service_down
    alias: "Мониторинг: сервис не отвечает"
    description: >-
      Срабатывает, когда любая из HTTP-проверок binary_sensor.svc_* держится
      в состоянии «off» дольше 5 минут. Пять минут — чтобы не шуметь на
      перезапуске контейнера или обновлении образа.
    mode: parallel
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.svc_qbittorrent
          - binary_sensor.svc_prowlarr
          - binary_sensor.svc_radarr
          - binary_sensor.svc_flaresolverr
          - binary_sensor.svc_jellyfin
          - binary_sensor.svc_seerr
        to: "off"
        for: "00:05:00"
    actions:
      - action: script.pachca_notify
        data:
          title: "Сервис не отвечает"
          text: >-
            **{{ trigger.to_state.name | replace('svc ', '') }}** не отвечает
            уже 5 минут.

            Проверьте контейнер: Container Manager → Проект → Логи,
            либо `sudo docker logs --tail 100 {{ trigger.to_state.name
            | replace('svc ', '') | lower }}`.
          level: crit

  # --- 3.2 Сервис вернулся ----------------------------------------------------
  - id: mon_service_up
    alias: "Мониторинг: сервис восстановился"
    mode: parallel
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.svc_qbittorrent
          - binary_sensor.svc_prowlarr
          - binary_sensor.svc_radarr
          - binary_sensor.svc_flaresolverr
          - binary_sensor.svc_jellyfin
          - binary_sensor.svc_seerr
        from: "off"
        to: "on"
        for: "00:01:00"
    actions:
      - action: script.pachca_notify
        data:
          title: "Сервис восстановился"
          text: "**{{ trigger.to_state.name | replace('svc ', '') }}** снова отвечает."
          level: ok

  # --- 3.3 Перегрев NAS -------------------------------------------------------
  # ВНИМАНИЕ: имена сенсоров Synology DSM зависят от имени NAS в DSM.
  # После шага 4.1 откройте Инструменты разработчика → Состояния,
  # отфильтруйте по "temperature" и подставьте реальные entity_id.
  - id: mon_nas_temperature
    alias: "Мониторинг: температура NAS"
    mode: single
    triggers:
      # Переход сенсора, а не numeric_state: разбор — у сенсора выше.
      - trigger: state
        entity_id: binary_sensor.nas_hot
        to: "on"
      # Напоминание, пока держится: без него о перегреве сообщают один раз.
      - trigger: time
        at: "10:00:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.nas_hot
        state: "on"
    actions:
      - action: script.pachca_notify
        data:
          title: "NAS перегревается"
          text: >-
            Температура {{ states('sensor.ds725_temperature') }} °C уже 10 минут.
            Проверьте вентилятор и вентиляцию корпуса.
          level: crit

  # --- 3.4 Долгая высокая загрузка CPU ----------------------------------------
  - id: mon_nas_cpu
    alias: "Мониторинг: высокая загрузка CPU"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.nas_cpu_busy
        to: "on"
      - trigger: time
        at: "10:00:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.nas_cpu_busy
        state: "on"
    actions:
      - action: script.pachca_notify
        data:
          title: "CPU NAS загружен более 20 минут"
          text: >-
            Загрузка {{ states('sensor.ds725_cpu_utilization_total') }} %.
            Обычные виновники: транскодирование в Jellyfin, проверка хэшей
            в qBittorrent, индексация Synology Photos.
          level: warn

  # --- 3.5 Место на томе ------------------------------------------------------
  - id: mon_volume_space
    alias: "Мониторинг: место на volume1"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.nas_volume_filling
        to: "on"
      - trigger: state
        entity_id: binary_sensor.nas_volume_critical
        to: "on"
      # Место кончается медленно и само не рассасывается — напоминаем
      # каждое утро, пока занято больше порога.
      - trigger: time
        at: "10:00:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.nas_volume_filling
        state: "on"
    actions:
      - action: script.pachca_notify
        data:
          title: "Заканчивается место на volume1"
          text: >-
            Занято {{ states('sensor.ds725_volume_1_volume_used') }} %.
            Проверьте /volume1/data и очередь загрузок qBittorrent.
          # Уровень берётся из второго порога, а не из id триггера:
          # при утреннем напоминании и при перезапуске триггер один,
          # а разница между «пора посмотреть» и «пора чистить» остаётся.
          level: "{{ 'crit' if is_state('binary_sensor.nas_volume_critical', 'on') else 'warn' }}"

  # --- 3.6 Проблемы с дисками -------------------------------------------------
  - id: mon_disk_health
    alias: "Мониторинг: здоровье дисков"
    description: >-
      Ловим любое отклонение SMART-статуса от «normal».
      Список entity_id заполните после шага 4.1 — их видно в карточке
      устройства Synology DSM.
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - sensor.ds725_drive_1_status
          - sensor.ds725_drive_2_status
        # not_to гарантирует, что не сработаем на unknown при перезапуске
        not_to:
          - "normal"
          - "unknown"
          - "unavailable"
        for: "00:05:00"
    actions:
      - action: script.pachca_notify
        data:
          title: "Диск сообщает о проблеме"
          text: >-
            {{ trigger.to_state.name }} → **{{ trigger.to_state.state }}**.
            Откройте DSM → Менеджер хранения → HDD/SSD и проверьте SMART.
            Если статус «critical» — планируйте замену диска.
          level: crit
