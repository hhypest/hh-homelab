# =============================================================================
#  packages/media_tv.yaml — LG 32LK540BPLA + приставка RockTek GX1
# =============================================================================
#  Устройства
#  ----------
#    media_player.lg_tv          — телевизор, 192.168.3.52 (webOS)
#    media_player.rocktek_gx1    — приставка, 192.168.3.54 (Android TV Remote)
#    remote.rocktek_gx1          — она же, для запуска приложений и кнопок
#
#  Если Home Assistant назвал сущности иначе, переименуйте их в карточках
#  устройств — весь файл ссылается именно на эти три идентификатора.
#
#  Как включается связка
#  ---------------------
#  Ведущий здесь телевизор, и порядок именно такой:
#
#      включаем телевизор → ждём его → ждём приставку → проверяем
#
#  Приставка подключена по Wi-Fi и по сети не будится: спящий Android TV
#  не отвечает, а WoWLAN на ней нет. Единственный способ её поднять —
#  HDMI-CEC от телевизора. Телевизор, наоборот, по сети будится: magic-пакет
#  шлёт автоматизация 4.1, и это ЕДИНСТВЕННАЯ точка входа во всю связку.
#
#  Отсюда следствие, которое стоит держать в голове: если телевизор уже
#  включён, а приставка нет, команда включения телевизора ничего не даст —
#  CEC отправляется в момент пробуждения. Сценарий такой случай замечает
#  и говорит об этом уведомлением, а не молчит.
#
#  Вход телевизора
#  ---------------
#  Сценарий вход НЕ переключает: телевизор и так встаёт на HDMI приставки —
#  либо его туда переводит CEC, либо он помнит последний источник. Если у вас
#  это не так, вернуть переключение можно шагом media_player.select_source
#  в конец tv_on; название разъёма смотрите в атрибуте source_list
#  сущности media_player.lg_tv.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Флаг «сегодня не выключать»
# -----------------------------------------------------------------------------
# Ночное автоотключение — вещь полезная ровно до того вечера, когда вы
# осознанно смотрите длинный фильм. Флаг снимает автоматику до утра и
# сбрасывается сам в 06:00. Его же удобно отдать Алисе.
input_boolean:
  tv_no_auto_off:
    name: "ТВ: не выключать ночью"
    icon: mdi:sleep-off

# -----------------------------------------------------------------------------
# 2. «Продолжить просмотр»: спрашиваем у Jellyfin, на чём вы остановились
# -----------------------------------------------------------------------------
# Эндпоинт /UserItems/Resume отдаёт список недосмотренного для пользователя.
# Нужны две вещи в secrets.yaml:
#   jellyfin_user_id     — GET /Users вернёт список с полем Id
#   jellyfin_auth_header — строка вида: MediaBrowser Token="ВАШ_API_КЛЮЧ"
# API-ключ создаётся в Jellyfin: Панель → Дополнительно → Ключи API.
#
# На Jellyfin старше 10.10 этого пути нет — там работает устаревший
#   http://127.0.0.1:8096/Users/{userId}/Items/Resume
# Проверить, какой отвечает, можно командой из раздела 7 чек-листа.
rest:
  - resource: "http://127.0.0.1:8096/UserItems/Resume"
    scan_interval: 300
    timeout: 15
    params:
      userId: !secret jellyfin_user_id
      limit: 1
      mediaTypes: Video
      enableImages: false
    headers:
      Authorization: !secret jellyfin_auth_header
      Accept: application/json
    sensor:
      - name: "Jellyfin Resume"
        unique_id: jellyfin_resume_item
        icon: mdi:play-pause
        value_template: >-
          {% set items = value_json.Items | default([]) %}
          {% if items | count == 0 %}
            нечего продолжать
          {% else %}
            {% set i = items[0] %}
            {% if i.Type == 'Episode' %}
              {{ i.SeriesName }} ·
              S{{ '%02d' % (i.ParentIndexNumber | int(0)) }}E{{ '%02d' % (i.IndexNumber | int(0)) }}
            {% else %}
              {{ i.Name }}
            {% endif %}
          {% endif %}
        json_attributes_path: "$.Items[0]"
        json_attributes:
          - Id
          - Name
          - Type
          - SeriesName
          - IndexNumber
          - ParentIndexNumber

# -----------------------------------------------------------------------------
# 3. Сенсор «ТВ включён, но ничего не играет»
# -----------------------------------------------------------------------------
# Отдельная сущность вместо условия внутри автоматизации: delay_on делает
# ровно то, что нужно — состояние становится «включено» только после того,
# как простой продержался двадцать минут подряд.
template:
  - binary_sensor:
      - name: "TV idle"
        unique_id: tv_idle_20min
        icon: mdi:television-pause
        state: >-
          {{ states('media_player.lg_tv') not in ['off', 'unavailable', 'unknown', 'standby']
             and states('media_player.lg_tv') != 'playing'
             and states('media_player.rocktek_gx1') != 'playing' }}
        delay_on: "00:20:00"
        delay_off: "00:00:30"

# =============================================================================
#  СЦЕНАРИИ
# =============================================================================
script:

  # ---------------------------------------------------------------------------
  # 3.1 Включить связку: приставка + телевизор + нужный вход
  # ---------------------------------------------------------------------------
  tv_on:
    alias: "ТВ: включить"
    icon: mdi:television-play
    mode: single
    sequence:
      # Шаг 1. Включаем телевизор — он здесь ведущий. Вызов поднимает
      # автоматизацию 4.1, та шлёт magic-пакет. Проснувшись, телевизор
      # поднимает приставку по HDMI-CEC: по сети её не разбудить, она
      # на Wi-Fi.
      - action: media_player.turn_on
        target:
          entity_id: media_player.lg_tv
        continue_on_error: true

      # Шаг 2. Ждём телевизор. Сорок пять секунд — с запасом на два
      # magic-пакета и загрузку webOS.
      - wait_template: >-
          {{ states('media_player.lg_tv') not in ['off', 'unavailable', 'unknown'] }}
        timeout: "00:00:45"
        continue_on_timeout: true

      # Шаг 3. Ждём приставку. Это самый долгий участок: CEC доходит до неё
      # почти сразу, а вот от подачи питания до готовности принимать команды
      # у GX1 уходит 30-40 секунд.
      #
      # Ждём по состоянию, а не выдержкой: ответила раньше — идём дальше,
      # а не досиживаем паузу. Полторы минуты — потолок, а не длительность.
      # Приставка стала грузиться дольше — увеличьте здесь.
      #
      # standby исключён намеренно: приставка с погашенным экраном
      # готовой не считается.
      - wait_template: >-
          {{ states('media_player.rocktek_gx1')
             not in ['off', 'unavailable', 'unknown', 'standby'] }}
        timeout: "00:01:30"
        continue_on_timeout: true

      # Шаг 4. Что-то не поднялось — говорим об этом вслух, и правильное.
      #
      # Молчать здесь нельзя: следующие сценарии отправят приставке команду
      # запуска приложения, она уйдёт в никуда, и снаружи это выглядит как
      # «Jellyfin не открывается».
      #
      # Случаев два, и путать их нельзя. Не проснулся телевизор — виноват
      # magic-пакет, а приставка не поднялась просто потому, что будить её
      # было нечем: CEC идёт от телевизора. Сказать в этом случае «включите
      # приставку пультом» — отправить человека чинить исправное устройство,
      # тогда как чинить надо кабель, MAC или «Быстрый запуск+».
      - choose:
          # Телевизор не проснулся — разбирательство начинается с него
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('media_player.lg_tv')
                     in ['off', 'unavailable', 'unknown'] }}
            sequence:
              - action: persistent_notification.create
                data:
                  title: "ТВ: телевизор не проснулся"
                  message: >-
                    Magic-пакет ушёл, но телевизор не отозвался за 45 секунд.
                    Приставка при этом и не могла подняться: её будит
                    телевизор по CEC. Проверьте по порядку: «Быстрый запуск+»
                    включён, телевизор подключён кабелем, MAC в secrets.yaml
                    совпадает с адресом из роутера.

          # Телевизор на месте, а приставка нет
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('media_player.rocktek_gx1')
                     in ['off', 'unavailable', 'unknown', 'standby'] }}
            sequence:
              - action: persistent_notification.create
                data:
                  title: "ТВ: приставка не отозвалась"
                  message: >-
                    Телевизор включён, но приставка не поднялась за полторы
                    минуты. По сети её не разбудить — включите пультом.
                    Частая причина: телевизор уже был включён, поэтому
                    команда CEC не ушла.

  # ---------------------------------------------------------------------------
  # 3.2 Выключить всё
  # ---------------------------------------------------------------------------
  tv_off:
    alias: "ТВ: выключить"
    icon: mdi:television-off
    mode: single
    sequence:
      # Сначала приставка: если выключить телевизор первым, приставка может
      # тут же разбудить его обратно по CEC.
      - action: media_player.turn_off
        target:
          entity_id: media_player.rocktek_gx1
        continue_on_error: true
      - delay: "00:00:02"
      - action: media_player.turn_off
        target:
          entity_id: media_player.lg_tv
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # 3.3 Jellyfin
  # ---------------------------------------------------------------------------
  tv_jellyfin:
    alias: "Смотреть Jellyfin"
    icon: mdi:movie-open-play
    mode: single
    sequence:
      # Вызов script.<имя> ждёт, пока сценарий отработает целиком,
      # в отличие от script.turn_on. Ждать нужно не телевизора, а приставки:
      # именно она грузится полминуты, и именно ей адресована следующая
      # команда. Ожидание живёт в шаге 3 сценария tv_on — здесь оно
      # получается само собой.
      #
      # Если приставка не поднялась, tv_on оставит уведомление, а команда
      # ниже уйдёт в никуда. Это осознанно: сценарий не угадывает за вас,
      # а сообщает, что произошло.
      - action: script.tv_on
      - action: remote.turn_on
        target:
          entity_id: remote.rocktek_gx1
        data:
          # Пакет официального клиента Jellyfin для Android TV.
          # Проверить фактический: откройте приложение вручную и посмотрите
          # атрибут app_id у media_player.rocktek_gx1.
          activity: "org.jellyfin.androidtv"

  # ---------------------------------------------------------------------------
  # 3.4 YouTube
  # ---------------------------------------------------------------------------
  tv_youtube:
    alias: "Смотреть YouTube"
    icon: mdi:youtube
    mode: single
    sequence:
      - action: script.tv_on
      - action: remote.turn_on
        target:
          entity_id: remote.rocktek_gx1
        data:
          # Ссылка надёжнее имени пакета: Google TV сам сопоставляет её
          # с установленным приложением.
          activity: "https://www.youtube.com"

  # ---------------------------------------------------------------------------
  # 3.5 Продолжить просмотр
  # ---------------------------------------------------------------------------
  # Схема: включаем связку → запускаем Jellyfin → ждём, пока клиент
  # зарегистрирует сессию на сервере (её видит интеграция Jellyfin и создаёт
  # для неё media_player) → отправляем в эту сессию недосмотренный элемент.
  # Jellyfin сам продолжит с сохранённой позиции.
  tv_jellyfin_resume:
    alias: "Продолжить просмотр"
    icon: mdi:play-speed
    mode: single
    sequence:
      - action: script.tv_jellyfin

      # Ждём появления активной сессии Jellyfin. Полторы минуты — с запасом
      # на холодный старт приложения.
      - wait_template: >-
          {% set ns = namespace(ok=false) %}
          {% for e in integration_entities('jellyfin') if e.startswith('media_player.') %}
            {% if states(e) not in ['unavailable', 'unknown', 'off'] %}
              {% set ns.ok = true %}
            {% endif %}
          {% endfor %}
          {{ ns.ok }}
        timeout: "00:01:30"
        continue_on_timeout: true

      - variables:
          jf_target: >-
            {% set ns = namespace(found='') %}
            {% for e in integration_entities('jellyfin') if e.startswith('media_player.') %}
              {% if ns.found == '' and states(e) not in ['unavailable', 'unknown', 'off'] %}
                {% set ns.found = e %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}
          resume_id: "{{ state_attr('sensor.jellyfin_resume', 'Id') | default('', true) }}"
          resume_type: "{{ (state_attr('sensor.jellyfin_resume', 'Type') | default('movie', true)) | lower }}"

      - choose:
          # Всё сошлось — отправляем контент в сессию
          - conditions:
              - condition: template
                value_template: "{{ jf_target != '' and resume_id != '' }}"
            sequence:
              - action: media_player.play_media
                target:
                  entity_id: "{{ jf_target }}"
                data:
                  media_content_id: "{{ resume_id }}"
                  media_content_type: "{{ resume_type }}"

          # Сессия есть, а продолжать нечего — оставляем открытый Jellyfin
          - conditions:
              - condition: template
                value_template: "{{ jf_target != '' and resume_id == '' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "Продолжить просмотр"
                  message: "В Jellyfin нет недосмотренного — открыл приложение."

        # Сессия не появилась: приложение открыто, дальше руками с пульта.
        # На главном экране Jellyfin первая строка — «Продолжить просмотр».
        default:
          - action: persistent_notification.create
            data:
              title: "Продолжить просмотр"
              message: >-
                Jellyfin запущен, но сессия клиента не появилась за полторы
                минуты. Проверьте, что приставка вошла в свою учётную запись
                Jellyfin.

# =============================================================================
#  АВТОМАТИЗАЦИИ
# =============================================================================
automation:

  # ---------------------------------------------------------------------------
  # 4.1 Включение телевизора по Wake-on-LAN
  # ---------------------------------------------------------------------------
  # Выключенный webOS не слушает сеть — нужен magic-пакет. Триггер срабатывает
  # на любой вызов media_player.turn_on для этого телевизора: из сценария,
  # из карточки в интерфейсе или голосом через Алису.
  #
  # ЭТО ЕДИНСТВЕННАЯ ТОЧКА ВХОДА ВО ВСЮ СВЯЗКУ. Приставка сидит на Wi-Fi
  # и по сети не будится; её поднимает телевизор по HDMI-CEC, а телевизор
  # поднимает отсюда. Не сработает эта автоматизация — не включится ничего.
  #
  # ЭТО ДЕРЖИТСЯ НА ПРОВОДНОМ ПОДКЛЮЧЕНИИ ТЕЛЕВИЗОРА.
  # Wake-on-LAN по Wi-Fi — другая технология, WoWLAN, и её должен поддерживать
  # сам модуль телевизора. На бюджетных LG её обычно нет: переключите телевизор
  # на Wi-Fi — и голосовое включение перестанет работать, а всё остальное
  # (переключение каналов, громкость, выключение) продолжит, потому что
  # включённый телевизор сеть слушает. Отсюда и коварство: поломка выглядит
  # как «Алиса иногда не включает телевизор».
  #
  # Прежде эта заметка допускала переезд телевизора на Wi-Fi: включение,
  # мол, всё равно идёт по CEC от приставки. С тех пор направление
  # перевернулось — теперь по CEC будится приставка, а не телевизор, —
  # и переезжать больше некуда: сеть телевизора стала обязательной.
  # Если всё же переезжаете — у беспроводного адаптера ДРУГОЙ MAC,
  # и tv_lg_mac в secrets.yaml нужно поменять, иначе пакет уйдёт в пустоту.
  # Проверять включение надо через 10-15 минут после выключения телевизора:
  # сразу после он откликается и без WoWLAN, пока модуль не ушёл в глубокий
  # сон, и проверка даёт ложноположительный результат.
  # Подробности и обходной путь через HDMI-CEC — в docs/keenetic.html.
  - id: tv_lg_wol
    alias: "ТВ: включение LG по Wake-on-LAN"
    mode: single
    triggers:
      - trigger: webostv.turn_on
        entity_id: media_player.lg_tv
    actions:
      - action: wake_on_lan.send_magic_packet
        data:
          mac: !secret tv_lg_mac
          broadcast_address: "192.168.3.255"
          broadcast_port: 9
      # Второй пакет через две секунды: телевизоры серии LK регулярно
      # просыпают первый.
      - delay: "00:00:02"
      - action: wake_on_lan.send_magic_packet
        data:
          mac: !secret tv_lg_mac
          broadcast_address: "192.168.3.255"
          broadcast_port: 9

  # ---------------------------------------------------------------------------
  # 4.2 Ночь: включено, но ничего не играет
  # ---------------------------------------------------------------------------
  # Классическое «вышел из комнаты и забыл». Проверяем каждые пятнадцать минут
  # с 00:30 до 06:00; binary_sensor.tv_idle загорается только после двадцати
  # минут простоя, так что пауза на перемотке ничего не выключит.
  - id: tv_night_idle_off
    alias: "ТВ: ночью выключить простаивающий"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: time
        after: "00:30:00"
        before: "06:00:00"
      - condition: state
        entity_id: input_boolean.tv_no_auto_off
        state: "off"
      - condition: state
        entity_id: binary_sensor.tv_idle
        state: "on"
    actions:
      - action: script.tv_off

  # ---------------------------------------------------------------------------
  # 4.3 Ночь: заснул под просмотр
  # ---------------------------------------------------------------------------
  # Здесь всё сложнее: идёт воспроизведение, и отличить «смотрю» от «сплю»
  # можно только спросив. Спрашиваем паузой: если человек не спит, он нажмёт
  # play, состояние вернётся в playing — и мы отступим.
  - id: tv_night_sleep_check
    alias: "ТВ: проверка «вы ещё смотрите?»"
    mode: single
    triggers:
      - trigger: time
        at: "01:30:00"
      - trigger: time
        at: "03:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.tv_no_auto_off
        state: "off"
      - condition: or
        conditions:
          - condition: state
            entity_id: media_player.rocktek_gx1
            state: "playing"
          - condition: state
            entity_id: media_player.lg_tv
            state: "playing"
    actions:
      # Предупреждаем на экране. Служба уведомлений webOS называется по имени
      # устройства — если у вас она иначе, шаг просто будет пропущен.
      - action: notify.lg_tv
        data:
          message: "Ещё смотрите? Через три минуты поставлю на паузу."
        continue_on_error: true

      - delay: "00:03:00"

      - action: media_player.media_pause
        target:
          entity_id: media_player.rocktek_gx1
        continue_on_error: true

      # Пять минут на то, чтобы нажать play. Нажали — выходим.
      - wait_for_trigger:
          - trigger: state
            entity_id: media_player.rocktek_gx1
            to: "playing"
        timeout: "00:05:00"
        continue_on_timeout: true

      - if:
          - condition: template
            value_template: "{{ wait.trigger is not none }}"
        then:
          # Проснулся и продолжил смотреть — до 03:00 больше не тревожим.
          - stop: "Просмотр продолжен"

      - action: script.tv_off

  # ---------------------------------------------------------------------------
  # 4.4 Сброс флага «не выключать» каждое утро
  # ---------------------------------------------------------------------------
  - id: tv_reset_no_auto_off
    alias: "ТВ: сбросить флаг «не выключать»"
    mode: single
    triggers:
      - trigger: time
        at: "06:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.tv_no_auto_off
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.tv_no_auto_off
