# =============================================================================
#  packages/docker.yaml — метрики по каждому контейнеру и надзор за ними
# =============================================================================
#  Требует компонента Monitor Docker (HACS: ualex73/monitor_docker) и
#  контейнера dockerproxy из compose.yaml.
#
#  Два разных темпа — и это принципиально
#  --------------------------------------
#  МЕТРИКИ (CPU, память) снимаются раз в час. Docker отдаёт статистику
#  потоком на каждый контейнер, это самая дорогая часть; на двухъядерном
#  R1600 частый опрос восьми контейнеров — заметная постоянная нагрузка,
#  а в базе истории он оставляет сотни тысяч строк в сутки.
#
#  СОСТОЯНИЕ (жив контейнер или нет) проверяется раз в минуту отдельным
#  скриптом bin/docker_state.py: он делает один дешёвый запрос
#  GET /containers/json, без всякой статистики. Узнавать о падении сервиса
#  через час было бы бессмысленно, а раз в минуту — почти бесплатно.
#
#  Что из этого следует
#  --------------------
#  Графики CPU и памяти теперь имеют 24 точки в сутки — это про «сколько
#  контейнер ест в среднем», а не «что было в 21:47». Если однажды
#  понадобится детализация, ставьте scan_interval: 300.
#
#  Безопасность
#  ------------
#  /var/run/docker.sock — полный root на NAS, и флаг :ro не защищает: сокет
#  не файл, права на чтение не мешают слать в него POST. Поэтому с сокетом
#  говорит только dockerproxy, а он пропускает лишь разрешённые методы.
# =============================================================================

monitor_docker:
  - name: Docker
    url: "http://127.0.0.1:2375"

    # Раз в час. Падения ловит command_line-сенсор ниже, ему хватает минуты.
    scan_interval: 3600

    sensorname: "Docker {name} {sensor}"
    switchname: "Docker {name}"
    switchenabled: false
    buttonenabled: false

    containers:
      - qbittorrent
      - prowlarr
      - radarr
      - flaresolverr
      - jellyfin
      - seerr
      - homeassistant
      - dockerproxy

    rename:
      qbittorrent: qBittorrent
      prowlarr: Prowlarr
      radarr: Radarr
      flaresolverr: FlareSolverr
      jellyfin: Jellyfin
      seerr: Seerr
      homeassistant: Home Assistant
      # «Proxy», а не «Docker Proxy»: имя подставляется в шаблон
      # "Docker {name} {sensor}", иначе вышло бы sensor.docker_docker_proxy_state
      dockerproxy: Proxy

    monitored_conditions:
      - version
      - containers_running
      - containers_total
      - containers_cpu_percentage
      - containers_memory
      - state
      - uptime
      - cpu_percentage
      - memory
      - memory_percentage

    precision_cpu: 1
    precision_memory_percentage: 1

# -----------------------------------------------------------------------------
# Быстрая проверка состояния — раз в минуту
# -----------------------------------------------------------------------------
command_line:
  - sensor:
      name: "Docker down"
      unique_id: docker_down_fast
      command: "python3 /config/bin/docker_state.py"
      scan_interval: 60
      command_timeout: 25
      unit_of_measurement: "шт"
      # Скрипт печатает JSON и никогда не завершается ошибкой, поэтому
      # сенсор не уходит в unavailable даже когда прокси лежит.
      value_template: "{{ value_json.down }}"
      # Каждый атрибут, который читают шаблоны, обязан быть здесь: Home
      # Assistant выбрасывает из JSON всё, что не объявлено. Признак
      # binary_sensor.docker_restarting год стоял бы на None именно
      # поэтому — скрипт печатал restarting, а сенсор его не забирал.
      # Сверяется тестом test_json_attributes.py.
      json_attributes:
        - running
        - total
        - down_names
        - down_detail
        - oom
        - restarting
        - error

# -----------------------------------------------------------------------------
# Сводные сенсоры
# -----------------------------------------------------------------------------
template:

  - binary_sensor:
      # Нужен для history_stats в packages/pachca.yaml: тот считает время
      # по состояниям, а не по числам.
      - name: "Docker problem"
        unique_id: docker_problem
        device_class: problem
        icon: mdi:docker
        state: >-
          {{ states('sensor.docker_down') | int(0) > 0
             or (state_attr('sensor.docker_down', 'error') | default('', true)) != '' }}
        delay_on: "00:02:00"
        delay_off: "00:01:00"

      # ---------------------------------------------------------------------
      #  Контейнер в цикле перезапуска
      # ---------------------------------------------------------------------
      #  Второй сценарий находки о падениях, и он тише первого. Контейнер
      #  с политикой unless-stopped падает и поднимается по кругу: счётчик
      #  упавших скачет 0 → 1 → 0 → 1 и почти никогда не держится выше нуля
      #  две минуты подряд. Выдержка не добирается до конца, и уведомления
      #  нет вообще — при том, что сервис не работает.
      #
      #  Признак берётся из состояния Docker «restarting»: политика ждёт
      #  перед следующей попыткой, и эта пауза удваивается с каждым падением,
      #  упираясь в минуту. Контейнер в цикле почти всегда застаётся именно
      #  в этом состоянии, а здоровый перезапуск проскакивает его
      #  за миллисекунды и в минутный опрос не попадает.
      #
      #  Источник — command_line-сенсор, а не Monitor Docker: у последнего
      #  scan_interval 3600, и любой признак на его данных обновлялся бы
      #  раз в час. Первая версия этой проверки считала возраст контейнера
      #  по sensor.docker_*_uptime и потому не могла сработать никогда:
      #  «моложе пяти минут» на часовых данных живёт от силы пять минут
      #  и десятиминутной выдержки не набирает. Замечание Codex.
      - name: "Docker restarting"
        unique_id: docker_restarting
        device_class: problem
        icon: mdi:restart-alert
        state: "{{ state_attr('sensor.docker_down', 'restarting') | int(0) > 0 }}"
        # Три минуты — три опроса подряд. Одиночная перезагрузка контейнера
        # столько в «restarting» не живёт.
        delay_on: "00:03:00"
        delay_off: "00:05:00"

  - sensor:
      - name: "Docker top CPU"
        unique_id: docker_top_cpu
        icon: mdi:chip
        unit_of_measurement: "%"
        # Обновляется вместе с метриками — то есть раз в час.
        #
        # ВАЖНО: агрегат исключает сам себя. Его entity_id —
        # sensor.docker_top_cpu — подходит под '^sensor\\.docker_.*_cpu$'
        # не хуже настоящих контейнеров, и сенсор попадал в собственную
        # выборку. На состоянии это не видно (максимум множества, в котором
        # лежит сам максимум, — тот же максимум), а вот имя победителя
        # ломалось: в сводку приезжало «Больше всех процессора: top».
        # Добивало округление. Состояние агрегата — round(1) от максимума,
        # то есть 2,95 % у jellyfin превращались в 3,0 % у «top», и 3,0 > 2,95
        # делало самозванца строго больше любого настоящего контейнера.
        # Показометр памяти той же беды избежал случайно: он назван
        # docker_top_ram, а ищет '_memory$' — то есть разошёлся с шаблоном
        # по имени, а не по замыслу. Поэтому исключение прописано и там.
        state: >-
          {% set vals = states.sensor
             | selectattr('entity_id', 'search', '^sensor\\.docker_.*_cpu$')
             | rejectattr('entity_id', 'in', ['sensor.docker_top_cpu'])
             | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | map(attribute='state') | map('float', 0) | list %}
          {{ vals | max | round(1) if vals | count > 0 else 0 }}
        attributes:
          container: >-
            {% set ns = namespace(best='—', val=-1) %}
            {% for s in states.sensor
               if s.entity_id is search('^sensor\\.docker_.*_cpu$')
               and s.entity_id != 'sensor.docker_top_cpu'
               and s.state not in ['unknown', 'unavailable'] %}
              {% if s.state | float(0) > ns.val %}
                {% set ns.val = s.state | float(0) %}
                {% set ns.best = s.name | replace('Docker ', '') | replace(' CPU', '') %}
              {% endif %}
            {% endfor %}
            {{ ns.best }}

      - name: "Docker top RAM"
        unique_id: docker_top_ram
        icon: mdi:memory
        unit_of_measurement: "MiB"
        state: >-
          {% set vals = states.sensor
             | selectattr('entity_id', 'search', '^sensor\\.docker_.*_memory$')
             | rejectattr('entity_id', 'in', ['sensor.docker_top_ram'])
             | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | map(attribute='state') | map('float', 0) | list %}
          {{ vals | max | round(0) if vals | count > 0 else 0 }}
        attributes:
          container: >-
            {% set ns = namespace(best='—', val=-1) %}
            {% for s in states.sensor
               if s.entity_id is search('^sensor\\.docker_.*_memory$')
               and s.entity_id != 'sensor.docker_top_ram'
               and s.state not in ['unknown', 'unavailable'] %}
              {% if s.state | float(0) > ns.val %}
                {% set ns.val = s.state | float(0) %}
                {% set ns.best = s.name | replace('Docker ', '') | replace(' Memory', '') %}
              {% endif %}
            {% endfor %}
            {{ ns.best }}

# -----------------------------------------------------------------------------
# Автоматизации
# -----------------------------------------------------------------------------
automation:

  # --- Контейнер упал --------------------------------------------------------
  - id: docker_container_down
    alias: "Docker: контейнер остановился"
    description: >-
      Состояние проверяется раз в минуту, выдержка две минуты — значит о
      падении вы узнаёте в пределах трёх минут. Двух минут достаточно, чтобы
      не реагировать на обновление образа и перезапуск проекта.
    mode: single
    triggers:
      # Триггер на АТРИБУТЕ, а не на счётчике. numeric_state above: 0
      # срабатывает только на переходе через порог: упал Radarr — сообщение
      # пришло; через час упал qBittorrent — счётчик идёт с 1 на 2, оба
      # значения выше нуля, перехода нет, и о втором падении вы узнаёте
      # утром из сводки. Список имён меняется на каждое новое падение,
      # поэтому ловим его.
      - trigger: state
        entity_id: sensor.docker_down
        attribute: down_names
        for: "00:02:00"
    conditions:
      # Список меняется и при восстановлении — тогда он становится пустым.
      - condition: numeric_state
        entity_id: sensor.docker_down
        above: 0
    actions:
      # Счётчики вынесены в переменные: в теле сообщения обращение целиком
      # не помещается в строку, а переносить строку в литеральном скаляре
      # нельзя — перенос попадёт в сообщение.
      - variables:
          running: "{{ state_attr('sensor.docker_down', 'running') }}"
          total: "{{ state_attr('sensor.docker_down', 'total') }}"

      - action: script.pachca_notify
        data:
          title: >-
            {{ 'Упал контейнер' if states('sensor.docker_down') | int(0) == 1
               else 'Упали контейнеры' }}
          # Литеральный скаляр, а не свёрнутый: «>-» склеивает соседние
          # строки пробелом, и при двух упавших контейнерах оба имени
          # оказывались в одной строке вместе со всем остальным текстом.
          text: |-
            {% for line in state_attr('sensor.docker_down', 'down_detail') | default([], true) -%}
            🔻 **{{ line }}**
            {% endfor %}
            Работает {{ running }} из {{ total }}.
            {%- if state_attr('sensor.docker_down', 'oom') %}

            ⚠️ Код выхода 137 — процесс убит из-за нехватки памяти.
            Посмотрите, что ещё занимало RAM в этот момент.
            {%- endif %}

            Поднять: `cd /volume1/docker/<проект> && sudo docker compose up -d`
          level: crit

  # --- Контейнер мечется -----------------------------------------------------
  - id: docker_container_restarting
    alias: "Docker: контейнер в цикле перезапуска"
    description: >-
      Падение, которое не ловится счётчиком упавших: контейнер поднимается
      быстрее, чем набирается двухминутная выдержка, поэтому «упавших» почти
      всегда ноль. Разбор — у сенсора binary_sensor.docker_restarting.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.docker_restarting
        to: "on"
    actions:
      - action: script.pachca_notify
        data:
          title: "Контейнер перезапускается по кругу"
          text: |-
            Уже десять минут какой-то контейнер стартует заново чаще, чем
            раз в пять минут. Счётчик упавших при этом может показывать ноль:
            контейнер успевает подняться до конца выдержки.

            Посмотреть, кто именно:
            `sudo docker ps --format '{{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Status{{ "}}" }}'`

            Причина обычно в журнале: `sudo docker logs --tail 50 <контейнер>`.
          level: warn

  # --- Всё поднялось ---------------------------------------------------------
  - id: docker_container_recovered
    alias: "Docker: все контейнеры снова работают"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.docker_down
        below: 1
        for: "00:02:00"
    conditions:
      # Не поздравляем сами себя, когда просто пропала связь с прокси
      - condition: template
        value_template: "{{ (state_attr('sensor.docker_down', 'error') | default('', true)) == '' }}"
    actions:
      - action: script.pachca_notify
        data:
          title: "Все контейнеры работают"
          text: >-
            Запущено {{ state_attr('sensor.docker_down', 'running') }}
            из {{ state_attr('sensor.docker_down', 'total') }}.
          level: ok

  # --- Пропала связь с самим прокси ------------------------------------------
  - id: docker_proxy_unreachable
    alias: "Docker: нет связи с dockerproxy"
    description: >-
      Отдельный случай: скрипт отвечает, но не может достучаться до прокси.
      Без этого сообщения «ноль упавших контейнеров» выглядело бы как
      «всё хорошо», хотя на деле мы просто ослепли.
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {{ (state_attr('sensor.docker_down', 'error') | default('', true)) != '' }}
        for: "00:05:00"
    actions:
      - action: script.pachca_notify
        data:
          title: "Не вижу состояние контейнеров"
          text: >-
            Скрипт проверки не может обратиться к dockerproxy:
            `{{ state_attr('sensor.docker_down', 'error') }}`.

            Проверьте на NAS: `curl -s http://127.0.0.1:2375/version`
          level: warn

  # --- Контейнер надолго занял процессор -------------------------------------
  - id: docker_container_cpu_hog
    alias: "Docker: контейнер держит CPU"
    description: >-
      Метрики теперь снимаются раз в час, поэтому выдержка 1 час 5 минут:
      сработает только если высокая загрузка держится в двух подряд
      измерениях, а не в одном случайном срезе во время транскодирования.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.docker_top_cpu
        above: 150
        for: "01:05:00"
    actions:
      - action: script.pachca_notify
        data:
          title: "Контейнер долго держит процессор"
          text: >-
            **{{ state_attr('sensor.docker_top_cpu', 'container') }}** —
            {{ states('sensor.docker_top_cpu') }} % в двух замерах подряд.

            Суммарно контейнеры занимают
            {{ states('sensor.docker_containers_cpu_percentage') }} %.
          level: warn
