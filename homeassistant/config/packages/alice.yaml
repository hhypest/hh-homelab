# =============================================================================
#  packages/alice.yaml — Алиса рассказывает о состоянии сервера
# =============================================================================
#  Задача: спросить голосом про температуру и загрузку — и услышать ответ
#  на колонке Мини 3, которая стоит в изолированном сегменте 10.0.50.0/24.
#
#  Два независимых пути, и они решают разные части задачи
#  -----------------------------------------------------
#
#  1. ТЕМПЕРАТУРА — нативно, без единого лишнего компонента.
#     Умный дом Яндекса умеет отвечать на вопросы о датчиках, но список
#     типов у него закрытый: температура, влажность, давление, заряд,
#     освещённость, концентрации газов и ещё десяток — и никакой
#     «загруженности процессора» там нет.
#     Температура в этот список попадает, поэтому работает сразу:
#       «Алиса, какая температура у сервера» → «42 градуса».
#
#  2. ЗАГРУЗКА — через произнесение фразы.
#     Раз подходящего типа датчика не существует, единственный честный
#     способ — заставить колонку сказать произвольный текст. Это умеет
#     компонент YandexStation (HACS: AlexxIT/YandexStation) в ОБЛАЧНОМ
#     режиме: локальный доступ к колонке не нужен, изоляция сегментов
#     сохраняется. Ограничение облачного режима — 100 символов на фразу,
#     поэтому текст ниже собран коротким и обрезается на всякий случай.
#     Работает так: скрипт отдан Яндексу как сценарий, вы говорите
#       «Алиса, включи отчёт о сервере» → колонка произносит цифры.
#
#  Что делать, если ставить YandexStation не хочется
#  -------------------------------------------------
#  Останется путь 1 плюс костыль: отдать загрузку процессора как свойство
#  battery_level устройству с именем «загрузка сервера». Алиса ответит
#  «заряд сорок семь процентов». Работает, но звучит нелепо — поэтому
#  вариант оставлен в комментариях в самом низу файла.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Зеркала метрик с предсказуемыми именами
# -----------------------------------------------------------------------------
# Сенсоры Synology называются по имени NAS в DSM, и оно у всех своё.
# Эти три сущности — стабильные псевдонимы: их отдаём Яндексу, на них
# ссылается дашборд, и при смене имени NAS правится ровно одна строка.
#
# ⚠️  Подставьте сюда реальные entity_id из шага 4.1 чек-листа.
template:
  - sensor:
      - name: "Server temperature"
        unique_id: alice_server_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('sensor.ds725_temperature') | float(0) | round(0) }}"
        availability: "{{ states('sensor.ds725_temperature') not in ['unknown', 'unavailable'] }}"

      - name: "Server CPU load"
        unique_id: alice_server_cpu
        state_class: measurement
        unit_of_measurement: "%"
        icon: mdi:chip
        state: "{{ states('sensor.ds725_cpu_utilization_total') | float(0) | round(0) }}"
        availability: "{{ states('sensor.ds725_cpu_utilization_total') not in ['unknown', 'unavailable'] }}"

      - name: "Server RAM load"
        unique_id: alice_server_ram
        state_class: measurement
        unit_of_measurement: "%"
        icon: mdi:memory
        state: "{{ states('sensor.ds725_memory_usage_real') | float(0) | round(0) }}"
        availability: "{{ states('sensor.ds725_memory_usage_real') not in ['unknown', 'unavailable'] }}"

      # ---------------------------------------------------------------------
      # Готовая фраза для колонки. Держим её короткой осознанно: облачный
      # режим YandexStation режет всё, что длиннее 100 символов, а Алиса
      # длинные технические перечисления всё равно проговаривает невнятно.
      # ---------------------------------------------------------------------
      - name: "Server voice status"
        unique_id: alice_server_phrase
        icon: mdi:account-voice
        state: >-
          {% set cpu = states('sensor.server_cpu_load') | int(0) %}
          {% set ram = states('sensor.server_ram_load') | int(0) %}
          {% set temp = states('sensor.server_temperature') | int(0) %}
          {% set down = state_attr('sensor.docker_down', 'down_names') | default([], true) %}
          {% set head = 'Процессор ' ~ cpu ~ ', память ' ~ ram ~ ' процентов, ' ~ temp ~ ' градусов. ' %}
          {% if down | count == 0 %}
            {{ (head ~ 'Всё работает.') | truncate(99, true, '') }}
          {% elif down | count == 1 %}
            {{ (head ~ 'Не работает ' ~ down[0] ~ '.') | truncate(99, true, '') }}
          {% else %}
            {{ (head ~ 'Не работают ' ~ down | count ~ ' контейнера.') | truncate(99, true, '') }}
          {% endif %}

# -----------------------------------------------------------------------------
# 2. Скрипт, который произносит отчёт на колонке
# -----------------------------------------------------------------------------
script:
  alice_server_report:
    alias: "Отчёт о сервере"
    icon: mdi:server-network
    mode: single
    description: >-
      Отдайте этот скрипт Умному дому Яндекса — он станет сценарием, и
      фраза «Алиса, включи отчёт о сервере» заставит колонку произнести
      текущие цифры.
    sequence:
      - variables:
          # Первая колонка из тех, что дал компонент YandexStation.
          # У вас она одна, поэтому искать по имени незачем — а если
          # появится вторая, впишите её entity_id сюда напрямую.
          speaker: >-
            {% set ns = namespace(found='') %}
            {% for e in integration_entities('yandex_station') if e.startswith('media_player.') %}
              {% if ns.found == '' %}{% set ns.found = e %}{% endif %}
            {% endfor %}
            {{ ns.found }}
          phrase: "{{ states('sensor.server_voice_status') }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ speaker != '' }}"
            sequence:
              - action: media_player.play_media
                target:
                  entity_id: "{{ speaker }}"
                data:
                  media_content_id: "{{ phrase }}"
                  # text — произнести как есть. Есть ещё dialog (сказать
                  # и продолжить слушать) и command (выполнить как голосовую
                  # команду), но здесь нужен именно text.
                  media_content_type: text
        default:
          - action: persistent_notification.create
            data:
              title: "Отчёт о сервере"
              message: >-
                Не нашёл колонку: компонент YandexStation не установлен или
                не выполнен вход в аккаунт Яндекса. Фраза, которую он должен
                был произнести: {{ phrase }}

# =============================================================================
#  ЧТО ОТДАТЬ ЯНДЕКСУ
# =============================================================================
#  В настройках интеграции Yandex Smart Home → «Список объектов» включите:
#
#    sensor.server_temperature   → станет датчиком температуры.
#                                  В приложении «Дом с Алисой» назовите его
#                                  «сервер» — тогда работает фраза
#                                  «Алиса, какая температура у сервера».
#
#    script.alice_server_report  → станет сценарием «отчёт о сервере».
#                                  Фраза: «Алиса, включи отчёт о сервере».
#
#  Имя устройства в приложении Яндекса — это то, что Алиса слышит и
#  произносит. В Home Assistant оно может называться как угодно.
# -----------------------------------------------------------------------------
#  ЗАПАСНОЙ ВАРИАНТ БЕЗ YandexStation
# -----------------------------------------------------------------------------
#  Раскомментируйте ПОСЛЕ установки компонента yandex_smart_home — иначе
#  Home Assistant не найдёт такую интеграцию и весь этот пакет не загрузится.
#  Загрузка процессора притворится уровнем заряда: Алиса ответит на вопрос
#  «какой заряд у загрузки сервера» числом процентов. Костыль, но рабочий.
#
# yandex_smart_home:
#   entity_config:
#     sensor.server_cpu_load:
#       name: Загрузка сервера
#       properties:
#         - type: battery_level
#           entity: sensor.server_cpu_load
#     sensor.server_temperature:
#       name: Сервер
#       properties:
#         - type: temperature
#           entity: sensor.server_temperature
