# =============================================================================
#  packages/pachca.yaml — уведомления в Пачку через входящий вебхук бота
# =============================================================================
#  Как это работает
#  ----------------
#  Уведомления Home Assistant идут через отдельного бота «Home Assistant»,
#  и он состоит РОВНО В ОДНОМ чате — «Мониторинг». Медиа-стек говорит
#  своими пятью ботами в чате «Кинозал», их шаблоны лежат в pachca/.
#
#  Пачка отдаёт боту постоянный URL «Входящего вебхука». Любой POST с телом
#     {"message": "текст"}
#  публикуется от имени бота во ВСЕ групповые чаты, где этот бот состоит —
#  поэтому держать бота в одном чате важно, а не желательно.
#  Токен зашит в сам URL — поэтому URL лежит в secrets.yaml и никуда больше.
#
#  ВАЖНО: у бота «Home Assistant» НЕ должно быть Liquid-шаблона. Здесь
#  собирается готовый текст, и Пачка публикует его как есть. Любой шаблон
#  на этом боте отрендерится в пустоту — полей movie или subject в нашем
#  payload нет, — а пустое сообщение Пачка не отправляет вовсе.
#  Пачка понимает markdown: **жирный**, *курсив*, `код`, ```блок```.
#  Лимит одного сообщения — 40 000 байт (~20 000 символов кириллицы).
#
#  Что здесь создаётся
#  -------------------
#  notify.pachca            — простая служба «отправь строку»
#  rest_command.pachca_send — низкоуровневая отправка произвольного текста
#  script.pachca_notify     — рабочая лошадка: заголовок + текст + важность
#  script.pachca_report     — сводка о работоспособности, шлётся в 09:00
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Простая notify-служба. Годится там, где нужен один голый текст:
#    action: notify.pachca / data: {message: "..."}
# -----------------------------------------------------------------------------
notify:
  - name: pachca
    platform: rest
    resource: !secret pachca_webhook_url
    method: POST_JSON
    message_param_name: message

# -----------------------------------------------------------------------------
# 2. rest_command — то же самое, но с явным UTF-8 и полным контролем над телом.
#    Используется скриптами ниже.
# -----------------------------------------------------------------------------
rest_command:
  pachca_send:
    url: !secret pachca_webhook_url
    method: POST
    content_type: "application/json; charset=utf-8"
    payload: '{"message": {{ text | to_json }} }'
    verify_ssl: true
    timeout: 20

script:

  # ---------------------------------------------------------------------------
  # 3. Основной способ отправки. Единый формат для всех уведомлений:
  #
  #    action: script.pachca_notify
  #    data:
  #      title: "Свободное место"
  #      text:  "На volume1 осталось 7 %"
  #      level: crit          # info | warn | crit | ok
  # ---------------------------------------------------------------------------
  pachca_notify:
    alias: "Пачка: отправить уведомление"
    icon: mdi:message-badge-outline
    # queued — если несколько автоматизаций сработают одновременно,
    # сообщения уйдут по очереди, а не потеряются.
    mode: queued
    max: 25
    fields:
      title:
        name: Заголовок
        required: true
        selector:
          text:
      text:
        name: Текст
        required: false
        selector:
          text:
            multiline: true
      level:
        name: Важность
        required: false
        default: info
        selector:
          select:
            options: [ok, info, warn, crit]
    sequence:
      - variables:
          icon: >-
            {{ {'ok': '✅', 'info': 'ℹ️', 'warn': '⚠️', 'crit': '🔴'}
               .get(level | default('info'), 'ℹ️') }}
          body: >-
            {{ icon }} **{{ title }}**

            {{ text | default('', true) }}

            `{{ now().strftime('%d.%m.%Y %H:%M') }}` · Home Assistant на DS725+
      - action: rest_command.pachca_send
        data:
          text: "{{ body }}"
        # continue_on_error: сбой Пачки не должен ронять автоматизацию целиком
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # 4. Утренняя сводка о работоспособности
  # ---------------------------------------------------------------------------
  #  Отвечает на один вопрос: «всё ли в порядке с хозяйством, пока я спал».
  #  Поэтому здесь и мгновенные значения, и накопленная за сутки статистика —
  #  ночной сбой, который сам починился к утру, иначе остался бы незамеченным.
  #
  #  Имена сенсоров Synology зависят от имени NAS в DSM: сверьте один раз
  #  в Инструментах разработчика и поправьте четыре строки ниже.
  # ---------------------------------------------------------------------------
  pachca_report:
    alias: "Пачка: сводка о работоспособности"
    icon: mdi:file-chart-outline
    mode: single
    sequence:
      - variables:
          # --- собираем факты ---
          svc_down: >-
            {{ states.binary_sensor
               | selectattr('entity_id', 'search', '^binary_sensor\\.svc_')
               | selectattr('state', 'eq', 'off')
               | map(attribute='name') | map('replace', 'svc ', '') | list }}
          svc_total: >-
            {{ states.binary_sensor
               | selectattr('entity_id', 'search', '^binary_sensor\\.svc_')
               | list | count }}
          svc_running: >-
            {{ states.binary_sensor
               | selectattr('entity_id', 'search', '^binary_sensor\\.svc_')
               | selectattr('state', 'eq', 'on') | list | count }}
          svc_unknown: >-
            {{ states.binary_sensor
               | selectattr('entity_id', 'search', '^binary_sensor\\.svc_')
               | rejectattr('state', 'in', ['on', 'off'])
               | map(attribute='name') | map('replace', 'svc ', '') | list }}
          cont_down: "{{ states('sensor.docker_down') | int(0) }}"
          cont_detail: "{{ state_attr('sensor.docker_down', 'down_detail') | default([], true) }}"
          cont_running: >-
            {{ state_attr('sensor.docker_down', 'running')
               if state_attr('sensor.docker_down', 'running') is not none else '—' }}
          cont_total: >-
            {{ state_attr('sensor.docker_down', 'total')
               if state_attr('sensor.docker_down', 'total') is not none else '—' }}
          docker_ok: >-
            {{ states('sensor.docker_down') not in ['unknown', 'unavailable']
               and (state_attr('sensor.docker_down', 'error') | default('', true)) == ''
               and state_attr('sensor.docker_down', 'total') | int(0) > 0 }}
          top_cpu: "{{ state_attr('sensor.docker_top_cpu', 'container') | default('—', true) }}"
          top_ram: "{{ state_attr('sensor.docker_top_ram', 'container') | default('—', true) }}"
          cpu: "{{ states('sensor.ds725_cpu_utilization_total') }}"
          ram: "{{ states('sensor.ds725_memory_usage_real') }}"
          # Отдельной проверкой на доступность, потому что в общий список
          # nas_ok этот сенсор не входит и входить не должен: пропавшее
          # время старта — не повод объявлять, что данных от NAS нет вовсе.
          # Но и печатать его сырым нельзя: в сводку за 20 сентября уехало
          # «Работает с unknown». Список nas_ok собран руками, и добавить
          # в тело новую строку, забыв про него, ничего не мешает — за этим
          # теперь следит test_summary_never_prints_unknown.
          booted: "{{ states('sensor.ds725_last_boot') }}"
          vol_used: "{{ states('sensor.ds725_volume_1_volume_used') | float(0) }}"
          nas_temp: "{{ states('sensor.ds725_temperature') | float(0) }}"
          # Приведение | float(0) превращает недоступный сенсор в ноль,
          # и отчёт получается уверенным враньём: интеграция Synology DSM
          # отвалилась, а сводка докладывает «Всё в порядке» и «0 °C».
          # Поэтому доступность проверяется до всякого приведения.
          nas_ok: >-
            {{ is_number(states('sensor.ds725_temperature'))
               and is_number(states('sensor.ds725_cpu_utilization_total'))
               and is_number(states('sensor.ds725_memory_usage_real'))
               and is_number(states('sensor.ds725_volume_1_volume_used')) }}
          # Простой за сутки history_stats отдаёт в часах — переводим в минуты
          # round(0) в Jinja возвращает дробное число, и в сводку уезжало
          # «Простой за сутки: 0.0 мин». int после round отрезает хвост.
          svc_down_min: "{{ (states('sensor.stack_downtime_24h') | float(0) * 60) | round | int }}"
          cont_down_min: "{{ (states('sensor.docker_downtime_24h') | float(0) * 60) | round | int }}"
          disks: >-
            {{ [states('sensor.ds725_drive_1_status'),
                states('sensor.ds725_drive_2_status')]
               | reject('in', ['normal', 'unknown', 'unavailable']) | list }}
          disks_ok: >-
            {{ states('sensor.ds725_drive_1_status') not in ['unknown', 'unavailable', '']
               and states('sensor.ds725_drive_2_status') not in ['unknown', 'unavailable', ''] }}

      - variables:
          # --- один общий вердикт в первой строке ---
          verdict: >-
            {% if nas_ok not in [true, 'True', 'true'] %}
              ⚠️ Нет данных от NAS — проверьте интеграцию Synology DSM
            {% elif docker_ok not in [true, 'True', 'true'] %}
              ⚠️ Нет данных от Docker — проверьте dockerproxy
            {% elif cont_down | int > 0 or svc_down | count > 0 or disks | count > 0 %}
              🔴 Есть проблемы прямо сейчас
            {% elif svc_unknown | count > 0 or svc_total | int != 7
                    or disks_ok not in [true, 'True', 'true'] %}
              ⚠️ Не все данные получены — проверьте HTTP-сенсоры и статусы дисков
            {% elif svc_down_min | int > 5 or cont_down_min | int > 5
                    or vol_used > 85 or nas_temp > 55 %}
              ⚠️ Работает, но есть на что посмотреть
            {% else %}
              ✅ Всё в порядке
            {% endif %}
          body: |-
            📊 **DS725+ — сводка за сутки**

            {{ verdict | trim }}

            **Железо**
            {% if nas_ok not in [true, 'True', 'true'] -%}
            • Метрики NAS недоступны: интеграция Synology DSM не отвечает
            {%- else -%}
            • Процессор {{ cpu }} % · память {{ ram }} % · {{ nas_temp | round | int }} °C
            • Том volume1 занят на {{ vol_used | round | int }} %
            • Диски: {% if disks | count > 0 %}⛔ {{ disks | join(', ') }}{% elif
              disks_ok in [true, 'True', 'true'] %}норма{% else %}нет данных{% endif %}
            • Работает с {{ booted if booted not in ['unknown', 'unavailable', 'none', '']
                             else '— нет данных, проверьте sensor.ds725_last_boot' }}
            {%- endif %}

            **Контейнеры** — {{ cont_running }} из {{ cont_total }}
            {% if docker_ok not in [true, 'True', 'true'] -%}
            • Нет данных от Docker: проверка состояния контейнеров недоступна
            {% elif cont_down | int > 0 -%}
            {% for line in cont_detail -%}
            • 🔻 {{ line }}
            {% endfor -%}
            {%- else -%}
            • Все запущены
            {% endif -%}
            • Простой за сутки: {{ cont_down_min }} мин
            • Больше всех процессора: {% if states('sensor.docker_top_cpu') not in ['unknown', 'unavailable']
              %}{{ top_cpu }} ({{ states('sensor.docker_top_cpu') }} %){% else %}нет данных{% endif %}
            • Больше всех памяти: {% if states('sensor.docker_top_ram') not in ['unknown', 'unavailable']
              %}{{ top_ram }} ({{ states('sensor.docker_top_ram') }} MiB){% else %}нет данных{% endif %}

            **Сервисы** — {{ svc_running }} из {{ svc_total }} отвечают
            {% if svc_down | count > 0 -%}
            • 🔴 Молчат: {{ svc_down | join(', ') }}
            {% elif svc_unknown | count == 0 and svc_total | int == 7 -%}
            • Все отвечают
            {% endif -%}
            {% if svc_unknown | count > 0 -%}
            • Нет данных: {{ svc_unknown | join(', ') }}
            {% endif -%}
            {% if svc_total | int != 7 -%}
            • Ожидаются семь HTTP-проверок: проверьте загрузку packages/monitoring.yaml
            {% endif -%}
            • Простой за сутки: {{ svc_down_min }} мин

      - action: rest_command.pachca_send
        data:
          text: "{{ body }}"
        continue_on_error: true

automation:

  # ---------------------------------------------------------------------------
  # 5. Проверка связи: HA сообщает о своём запуске. Это же первый тест вебхука.
  # ---------------------------------------------------------------------------
  - id: pachca_ha_started
    alias: "Пачка: Home Assistant запущен"
    description: >-
      Сообщает в Пачку о старте HA. Полезно, чтобы заметить незапланированный
      перезапуск контейнера или NAS.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # Ждём, пока поднимутся интеграции и заполнятся сенсоры
      - delay: "00:02:00"
      - action: script.pachca_notify
        data:
          title: "Home Assistant запущен"
          text: >-
            Сущностей загружено: {{ states | count }}.
            Контейнеров под наблюдением:
            {{ states('sensor.docker_containers_total') }}.
          level: ok

  # ---------------------------------------------------------------------------
  # 6. Ежедневная сводка в 09:00
  # ---------------------------------------------------------------------------
  - id: pachca_daily_report
    alias: "Пачка: ежедневная сводка 09:00"
    description: >-
      Одно сообщение в день о том, как хозяйство пережило прошедшие сутки.
      В 09:00, потому что к этому времени уже понятно, что происходило ночью,
      и есть время починить до вечера.
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
    actions:
      - action: script.pachca_report
