# =============================================================================
#  /volume1/docker/homeassistant/config/configuration.yaml
#  Home Assistant для DS725+ (192.168.3.53), сеть 192.168.3.0/24
# =============================================================================
#  Структура:
#    configuration.yaml   — этот файл, только базовые настройки
#    secrets.yaml         — токены и координаты (НЕ попадает в бэкапы в открытом виде)
#    packages/*.yaml      — логические блоки: Пачка, мониторинг, ТВ
#    automations.yaml     — автоматизации, созданные через UI
#    scripts.yaml         — скрипты, созданные через UI
# =============================================================================

# Базовый набор: onboarding, история, логбук, zeroconf/ssdp/dhcp-обнаружение,
# мобильное приложение, бэкапы, энергомониторинг и т. д.
default_config:

homeassistant:
  # Имя дома в интерфейсе. В публичном репозитории оставлено нейтральным:
  # совпадение с именем вашей Wi-Fi сети — лишняя зацепка для тех, кто
  # сопоставляет SSID с координатами. Локально можно назвать как угодно.
  name: Home
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: metric
  temperature_unit: C
  time_zone: Europe/Moscow
  currency: RUB
  country: RU
  internal_url: "http://192.168.3.53:8123"
  # Раскомментируйте после настройки KeenDNS (шаг 9 чек-листа):
  # external_url: !secret ha_external_url

  # Подключаем каталог packages — вся прикладная логика лежит там
  packages: !include_dir_named packages

# -----------------------------------------------------------------------------
# HTTP — здесь больше нет, и это не упущение
# -----------------------------------------------------------------------------
# Начиная с Home Assistant 2026.8 секция http: из configuration.yaml
# не читается. При первом запуске после обновления HA переносит её
# содержимое в интерфейс и заводит напоминание в Settings → System →
# Repairs: убрать блок из файла. Оставленный блок ничего не сломает,
# но будет молча игнорироваться — а это хуже, чем его отсутствие:
# правка в нём выглядит как настройка, но ни на что не влияет.
#
# Настройки живут в Settings → System → Network, раздел HTTP server.
# Значения, которые здесь стояли и уехали туда при переносе:
#
#     Server port ................ 8123
#     Enable IP banning .......... включено
#     Login attempts before ban .. 5
#     Trust X-Forwarded-For ...... ВЫКЛЮЧЕНО
#     Trusted proxies ............ пусто
#
# Последние две — осознанный выбор, а не забывчивость. Они нужны только
# когда перед HA стоит реверс-прокси: например, при публикации наружу
# через KeenDNS на роутере. Снаружи сюда ходят через VPN-сервер
# на роутере, то есть по внутреннему адресу и без прокси, и доверять
# заголовку X-Forwarded-For незачем: включённым «про запас» он позволил
# бы подменить адрес клиента и обойти счётчик неудачных входов, на
# котором держится блокировка по IP. Вернётся публикация — включить обе
# вместе, поодиночке они смысла не имеют.
#
# ВНИМАНИЕ: этих настроек больше нет под контролем версий. Они лежат
# в config/.storage/, а этот каталог в .gitignore — там же токены
# и учётные записи. Клон на новой машине поднимется с настройками HTTP
# по умолчанию: блокировка по IP будет выключена. Проверять руками,
# по списку выше. Подробнее — docs/index.html, шаг 2.7.

# -----------------------------------------------------------------------------
# Recorder — база истории (SQLite на /volume1)
# -----------------------------------------------------------------------------
# На NAS важно не устраивать постоянную запись мелкими транзакциями:
# commit_interval: 15 собирает изменения пачками и заметно щадит диски.
recorder:
  purge_keep_days: 21
  commit_interval: 15
  auto_purge: true
  auto_repack: true
  exclude:
    domains:
      - update
      - automation
      - persistent_notification
    entity_globs:
      - sensor.*_uptime
      - sensor.sun_*
      - sensor.*_last_boot
      # Monitor Docker добавляет примерно полсотни сенсоров. График CPU и
      # памяти по контейнеру — полезен, история отметки времени старта — нет,
      # а на шпиндельных дисках каждая лишняя запись заметна.
      #
      # Здесь стояли ещё две маски, sensor.docker_*_image и
      # sensor.docker_*_status, и обе не совпадали ни с чем: в
      # monitored_conditions нет ни image, ни status, а текстовое состояние
      # контейнера называется state. Мёртвая строка в списке исключений
      # опаснее отсутствующей — она выглядит как работающая защита.
      #
      # Само sensor.docker_*_state намеренно оставлено в истории: оно
      # меняется только когда с контейнером что-то действительно произошло,
      # и это ровно та история, которая нужна при разборе «когда именно
      # упал radarr».
      - sensor.docker_*_uptime
    entities:
      - sensor.date
      - sensor.time

# -----------------------------------------------------------------------------
# Логи
# -----------------------------------------------------------------------------
logger:
  default: warning
  logs:
    homeassistant.components.webostv: info
    homeassistant.components.androidtv_remote: info
    homeassistant.components.synology_dsm: info
    custom_components.monitor_docker: warning
    custom_components.yandex_smart_home: info

# -----------------------------------------------------------------------------
# Wake-on-LAN — нужен, чтобы включать LG-телевизор magic-пакетом
# -----------------------------------------------------------------------------
wake_on_lan:

# -----------------------------------------------------------------------------
# Стандартные include'ы для сущностей, создаваемых через интерфейс
# -----------------------------------------------------------------------------
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
