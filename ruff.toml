# Скрипты здесь запускаются внутри контейнера Home Assistant и в CI,
# сторонних зависимостей у них нет. Правила выбраны так, чтобы ловить
# настоящие ошибки, а не спорить о стиле.
# Те же 120, что и у yamllint: правило одно на весь репозиторий.
line-length = 120
target-version = "py311"

[lint]
select = [
  "E",    # pycodestyle: отступы, пробелы
  "F",    # pyflakes: неиспользуемые имена, опечатки в переменных
  "W",    # предупреждения
  "I",    # порядок импортов
  "UP",   # устаревшие конструкции
  "B",    # частые ловушки (bugbear)
  "C4",   # неоптимальные comprehensions
  "SIM",  # упрощения
  "N",    # pep8-naming: единый стиль имён
  "PLC2401",  # имя функции или переменной не латиницей
  "PLC2403",  # импорт под именем не латиницей
  "RUF",  # правила самого ruff
]
ignore = [
  # E501 здесь больше нет. Он и был единственным, кто следит за длиной строк:
  # сам по себе line-length влияет только на него и на ruff format, а формат
  # в CI не запускается. Комментарий рядом с исключением утверждал обратное —
  # «длину сторожит line-length», — и строка в триста символов проходила
  # проверку молча. Предел поднят со ста до ста двадцати: на этой границе
  # ни одна существующая строка не нарушает правило, а комментарии на русском
  # остаются читаемыми.
  "RUF001",  # кириллица рядом с латиницей — здесь это норма, а не гомоглифы
  "RUF002",
  "RUF003",
]

# Имена процедур, функций и переменных — только латиницей: PLC2401 и PLC2403.
# Русский язык остаётся там, где он и нужен: в документации, комментариях,
# docstring и текстах сообщений. Раньше здесь стояло обратное послабление —
# «в тестах имена функций на русском осознанно», — и оно ничего не значило:
# правила N в select не входили, так что per-file-ignores отключал то, что
# и без него не работало. Теперь правило есть и запрет настоящий.
